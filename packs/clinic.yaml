knowledge:
  - {q: "What are your timings?", core: true, tags: ["hours","open","timing","sunday","lunch","holiday"], a: "We're open Monday to Saturday, 9am to 8pm, with a lunch break from 2 to 3pm. On Sundays we're open 9am to 1pm for emergencies only.",
     a_hi: "हम सोमवार से शनिवार सुबह 9 बजे से रात 8 बजे तक खुले हैं, दोपहर 2 से 3 बजे लंच ब्रेक। रविवार सुबह 9 से दोपहर 1 बजे तक सिर्फ़ इमरजेंसी।",
     a_te: "మేము సోమవారం నుండి శనివారం ఉదయం 9 నుండి రాత్రి 8 వరకు తెరిచి ఉంటాము, మధ్యాహ్నం 2 నుండి 3 వరకు విరామం. ఆదివారం ఉదయం 9 నుండి మధ్యాహ్నం 1 వరకు అత్యవసరం మాత్రమే.",
     k_hi: "समय समय टाइमिंग खुला बंद कब घंटे रविवार छुट्टी",
     k_te: "సమయం సమయాలు టైమింగ్ తెరుస్తారు మూసివేత ఎప్పుడు గంటలు ఆదివారం"}
  - {q: "Where are you located / how do I reach you?", tags: ["address","location","reach","directions","landmark","parking"], a: "We're at 12 MG Road, Camp, Pune, opposite Sarasbaug and above HDFC Bank. Free two-wheeler parking is available; paid car parking is next door.",
     a_hi: "हम 12 एमजी रोड, कैंप, पुणे में हैं — सारसबाग के सामने, एचडीएफसी बैंक के ऊपर। दोपहिया पार्किंग मुफ़्त है, कार पार्किंग बगल में है।",
     a_te: "మేము 12 ఎంజీ రోడ్, క్యాంప్, పూణేలో ఉన్నాము — సారస్‌బాగ్ ఎదురుగా, హెచ్‌డీఎఫ్‌సీ బ్యాంక్ పైన. ద్విచక్ర వాహన పార్కింగ్ ఉచితం.",
     k_hi: "पता कहाँ जगह लोकेशन रास्ता पहुँचें पार्किंग",
     k_te: "చిరునామా ఎక్కడ ప్రదేశం లొకేషన్ దారి చేరుకోవడం పార్కింగ్"}
  - {q: "Which doctors are available and when?", tags: ["doctor","physician","skin","dermatologist","cardiology","pediatric","gynaec","specialist","available"], a: "Dr Sharma (General Physician) 9am–2pm and Dr Mehta (Dermatologist) 3pm–8pm, Mon–Sat. Dr Rao (Cardiology) visits Tue & Fri evenings, Dr Fernandes (Pediatrics) mornings, and Dr Iyer (Gynaecology) on Mon, Wed, Fri.",
     a_hi: "सोम–शनि: डॉ. शर्मा (जनरल फिजिशियन) सुबह 9–दोपहर 2, डॉ. मेहता (त्वचा) दोपहर 3–रात 8। डॉ. राव (हृदय) मंगल, शुक्र शाम 5–8। डॉ. फर्नांडिस (बाल रोग) सुबह 10–1। डॉ. अय्यर (स्त्री रोग) सोम, बुध, शुक्र सुबह 11–दोपहर 2।",
     a_te: "సోమ–శని: డాక్టర్ శర్మ (జనరల్ ఫిజీషియన్) ఉదయం 9–మధ్యాహ్నం 2, డాక్టర్ మెహతా (చర్మం) మధ్యాహ్నం 3–రాత్రి 8. డాక్టర్ రావు (గుండె) మంగళ, శుక్ర సాయంత్రం 5–8. డాక్టర్ ఫెర్నాండెస్ (పిల్లలు) ఉదయం 10–1. డాక్టర్ అయ్యర్ (స్త్రీ) సోమ, బుధ, శుక్ర ఉదయం 11–మధ్యాహ్నం 2.",
     k_hi: "डॉक्टर डाक्टर कौन कब उपलब्ध अवेलेबल विशेषज्ञ स्पेशलिस्ट समय शर्मा मेहता राव",
     k_te: "డాక్టర్ డాక్టర్లు ఎవరు ఎప్పుడు అందుబాటులో స్పెషలిస్ట్ వైద్యుడు సమయం శర్మ మెహతా రావు"}
  - {q: "What is the consultation fee?", tags: ["fee","cost","price","charge","consultation"], a: "General Physician ₹500, Dermatology ₹700, Cardiology ₹900, Pediatrics ₹600, and Gynaecology ₹700.",
     a_hi: "जनरल फिजिशियन ₹500, त्वचा रोग ₹700, हृदय रोग ₹900, बाल रोग ₹600 और स्त्री रोग ₹700।",
     a_te: "జనరల్ ఫిజీషియన్ ₹500, చర్మ వైద్యం ₹700, గుండె వైద్యం ₹900, పిల్లల వైద్యం ₹600, స్త్రీ వైద్యం ₹700.",
     k_hi: "फीस फ़ीस शुल्क कितना खर्च दाम रेट चार्ज कीमत पैसा परामर्श कंसल्टेशन",
     k_te: "ఫీజు ఫీజులు రుసుము ఎంత ఖర్చు ధర రేటు చార్జి డబ్బు సంప్రదింపు"}
  - {q: "Do I need an appointment or can I walk in?", tags: ["walk-in","appointment","queue","waiting"], a: "Walk-ins are welcome but may involve a 20–40 minute wait. An appointment guarantees your slot with minimal waiting.",
     a_hi: "बिना अपॉइंटमेंट भी आ सकते हैं, पर 20 से 40 मिनट इंतज़ार करना पड़ सकता है। अपॉइंटमेंट लेने पर आपका समय पक्का रहता है।",
     a_te: "అపాయింట్‌మెంట్ లేకుండా కూడా రావచ్చు, కానీ 20 నుండి 40 నిమిషాలు వేచి ఉండాల్సి రావచ్చు. అపాయింట్‌మెంట్ తీసుకుంటే మీ సమయం ఖాయం.",
     k_hi: "अपॉइंटमेंट बुकिंग वॉक इन सीधे आना ज़रूरी इंतज़ार",
     k_te: "అపాయింట్‌మెంట్ బుకింగ్ నేరుగా రావచ్చు అవసరమా వేచి"}
  - {q: "How do I get my test report?", tags: ["report","result","test","blood","pathology","whatsapp"], a: "Lab reports are ready within 24 hours and can be collected at the front desk or sent on WhatsApp at +91 98765 43210. Our staff can't read results over the phone.",
     a_hi: "लैब रिपोर्ट 24 घंटे में तैयार हो जाती है — फ्रंट डेस्क से ले सकते हैं या व्हाट्सएप पर +91 98765 43210 पर भेज देंगे। फ़ोन पर रिपोर्ट नहीं बताई जाती।",
     a_te: "ల్యాబ్ రిపోర్ట్ 24 గంటల్లో సిద్ధమవుతుంది — ఫ్రంట్ డెస్క్‌లో తీసుకోవచ్చు లేదా వాట్సాప్ +91 98765 43210 కు పంపుతాము. ఫోన్‌లో రిపోర్ట్ చెప్పము.",
     k_hi: "रिपोर्ट नतीजा टेस्ट जांच व्हाट्सएप कब मिलेगी",
     k_te: "రిపోర్ట్ ఫలితం పరీక్ష వాట్సాప్ ఎప్పుడు వస్తుంది"}
  - {q: "Do you do home sample collection?", tags: ["home","sample","collection","blood test"], a: "Yes, home blood-sample collection is available for ₹150 extra within 5km. Share your address and we'll schedule it.",
     a_hi: "जी हाँ, 5 किलोमीटर के भीतर घर से ब्लड सैंपल लेने की सुविधा ₹150 अतिरिक्त में उपलब्ध है। पता बताइए, हम समय तय कर देंगे।",
     a_te: "అవును, 5 కిలోమీటర్ల లోపల ఇంటి నుండి రక్త నమూనా సేకరణ ₹150 అదనంగా అందుబాటులో ఉంది. చిరునామా చెప్పండి, సమయం నిర్ణయిస్తాము.",
     k_hi: "घर होम सैंपल कलेक्शन ब्लड खून लेने",
     k_te: "ఇంటి హోమ్ నమూనా సేకరణ రక్త"}
  - {q: "Do you accept insurance / which ones?", tags: ["insurance","cashless","tpa","mediclaim","policy"], a: "Yes, we accept cashless insurance from Star Health, HDFC Ergo, ICICI Lombard, and most major TPAs. Please bring your insurance card and a photo ID.",
     a_hi: "जी हाँ, स्टार हेल्थ, एचडीएफसी एर्गो, आईसीआईसीआई लोम्बार्ड और ज़्यादातर टीपीए की कैशलेस इंश्योरेंस स्वीकार है। कृपया इंश्योरेंस कार्ड और फोटो आईडी लाइए।",
     a_te: "అవును, స్టార్ హెల్త్, హెచ్‌డీఎఫ్‌సీ ఎర్గో, ఐసీఐసీఐ లాంబార్డ్ మరియు చాలా టీపీఏల క్యాష్‌లెస్ బీమా అంగీకరిస్తాము. దయచేసి బీమా కార్డు మరియు ఫోటో ఐడీ తీసుకురండి.",
     k_hi: "इंश्योरेंस बीमा कैशलेस मेडिक्लेम पॉलिसी टीपीए",
     k_te: "బీమా ఇన్సూరెన్స్ క్యాష్‌లెస్ మెడిక్లెయిమ్ పాలసీ"}
  - {q: "What payment methods do you accept?", tags: ["payment","upi","card","cash"], a: "We accept UPI, credit and debit cards, and cash.",
     a_hi: "हम यूपीआई, क्रेडिट और डेबिट कार्ड, और नकद स्वीकार करते हैं।",
     a_te: "మేము యూపీఐ, క్రెడిట్ మరియు డెబిట్ కార్డులు, నగదు స్వీకరిస్తాము.",
     k_hi: "पेमेंट भुगतान यूपीआई कार्ड नकद कैश पैसे",
     k_te: "చెల్లింపు యూపీఐ కార్డు నగదు డబ్బు"}
  - {q: "Do you give vaccinations?", tags: ["vaccination","vaccine","child","flu","tetanus","covid"], a: "Yes — child immunisations and adult vaccines like flu, tetanus, and hepatitis B. Booking is recommended.",
     a_hi: "जी हाँ — बच्चों के टीके और बड़ों के लिए फ्लू, टिटनेस, हेपेटाइटिस बी जैसे टीके लगते हैं। पहले से बुक करना बेहतर है।",
     a_te: "అవును — పిల్లల టీకాలు మరియు పెద్దలకు ఫ్లూ, టెటానస్, హెపటైటిస్ బి వంటి టీకాలు వేస్తాము. ముందుగా బుక్ చేసుకోవడం మంచిది.",
     k_hi: "टीका वैक्सीन टीकाकरण फ्लू",
     k_te: "టీకా వ్యాక్సిన్ టీకాలు ఫ్లూ"}
  - {q: "What health check-up packages do you have?", tags: ["package","health check","full body","checkup","senior","diabetic"], a: "Basic ₹1,500, Full-body ₹4,000, Diabetic ₹2,500, and Senior Citizen ₹3,500. All include a doctor consultation and a report within 24 hours.",
     a_hi: "बेसिक ₹1,500, फुल-बॉडी ₹4,000, डायबिटिक ₹2,500 और सीनियर सिटिज़न ₹3,500। सभी में डॉक्टर से परामर्श और 24 घंटे में रिपोर्ट शामिल है।",
     a_te: "బేసిక్ ₹1,500, ఫుల్-బాడీ ₹4,000, డయాబెటిక్ ₹2,500, సీనియర్ సిటిజన్ ₹3,500. అన్నింటిలో డాక్టర్ సంప్రదింపు మరియు 24 గంటల్లో రిపోర్ట్ ఉంటుంది.",
     k_hi: "पैकेज हेल्थ चेकअप जांच फुल बॉडी सीनियर डायबिटिक",
     k_te: "ప్యాకేజీ హెల్త్ చెకప్ పరీక్ష ఫుల్ బాడీ సీనియర్ డయాబెటిక్"}
  - {q: "What should I bring for my first visit?", tags: ["first visit","documents","id","new patient"], a: "Please bring a photo ID, any past prescriptions or reports, and your insurance card if you have one.",
     a_hi: "कृपया फोटो आईडी, पुरानी पर्चियाँ या रिपोर्ट, और इंश्योरेंस कार्ड (अगर है) साथ लाइए।",
     a_te: "దయచేసి ఫోటో ఐడీ, పాత ప్రిస్క్రిప్షన్లు లేదా రిపోర్టులు, మరియు బీమా కార్డు (ఉంటే) తీసుకురండి.",
     k_hi: "लाना पहली बार दस्तावेज़ आईडी नया मरीज़",
     k_te: "తీసుకురావాలి మొదటిసారి పత్రాలు ఐడీ కొత్త"}
  - {q: "Can I get a prescription refilled?", tags: ["prescription","refill","medicine","repeat"], a: "I can note your request, but a doctor must review it first. I can book a quick follow-up for the refill."}
  - {q: "What is your cancellation policy?", tags: ["cancel","reschedule","policy"], a: "You can reschedule or cancel free of charge up to 2 hours before your appointment.",
     a_hi: "अपॉइंटमेंट से 2 घंटे पहले तक आप बिना किसी शुल्क के समय बदल या रद्द कर सकते हैं।",
     a_te: "అపాయింట్‌మెంట్‌కు 2 గంటల ముందు వరకు ఎటువంటి రుసుము లేకుండా మార్చుకోవచ్చు లేదా రద్దు చేసుకోవచ్చు.",
     k_hi: "कैंसिल रद्द रीशेड्यूल बदलना पॉलिसी",
     k_te: "రద్దు క్యాన్సిల్ మార్చడం రీషెడ్యూల్ పాలసీ"}
  - {q: "Do you have a pharmacy?", tags: ["pharmacy","medicine","chemist"], a: "Yes, there's an in-house pharmacy open during clinic hours.",
     a_hi: "जी हाँ, क्लिनिक के खुले समय में इन-हाउस फ़ार्मेसी उपलब्ध है।",
     a_te: "అవును, క్లినిక్ తెరిచి ఉన్న సమయంలో ఇన్-హౌస్ ఫార్మసీ అందుబాటులో ఉంది.",
     k_hi: "फार्मेसी दवा दवाई मेडिकल केमिस्ट",
     k_te: "ఫార్మసీ మందు మెడికల్ కెమిస్ట్"}
  - {q: "What diagnostic tests do you offer?", tags: ["test","x-ray","ultrasound","ecg","blood","cbc","thyroid","diagnostic","scan"], a: "We offer blood tests (CBC, thyroid, diabetes, lipid), ECG, X-ray, and ultrasound in-house. Reports within 24 hours.",
     a_hi: "हम ब्लड टेस्ट (सीबीसी, थायरॉइड, डायबिटीज़, लिपिड), ईसीजी, एक्स-रे और अल्ट्रासाउंड करते हैं। रिपोर्ट 24 घंटे में।",
     a_te: "మేము రక్త పరీక్షలు (సీబీసీ, థైరాయిడ్, డయాబెటిస్, లిపిడ్), ఈసీజీ, ఎక్స్-రే మరియు అల్ట్రాసౌండ్ చేస్తాము. రిపోర్ట్ 24 గంటల్లో.",
     k_hi: "टेस्ट जांच एक्स रे अल्ट्रासाउंड ईसीजी ब्लड खून थायरॉइड स्कैन",
     k_te: "పరీక్షలు ఎక్స్ రే అల్ట్రాసౌండ్ ఈసీజీ రక్త థైరాయిడ్ స్కాన్"}
  - {q: "Do you offer teleconsultation / video consult?", tags: ["tele","video","online","phone consult"], a: "Yes, video consultations are available with our General Physician and Dermatologist for ₹400. I can book one for you.",
     a_hi: "जी हाँ, जनरल फिजिशियन और त्वचा रोग विशेषज्ञ के साथ वीडियो कंसल्टेशन ₹400 में उपलब्ध है। मैं बुक कर सकती हूँ।",
     a_te: "అవును, జనరల్ ఫిజీషియన్ మరియు చర్మ వైద్యుడితో వీడియో సంప్రదింపు ₹400కి అందుబాటులో ఉంది. నేను బుక్ చేయగలను.",
     k_hi: "वीडियो टेली ऑनलाइन फोन कंसल्ट",
     k_te: "వీడియో టెలీ ఆన్‌లైన్ ఫోన్ సంప్రదింపు"}
  - {q: "Do you have emergency or ambulance services?", tags: ["emergency","ambulance","urgent","night"], a: "For a medical emergency please call 108 for an ambulance. Our clinic handles urgent walk-ins during opening hours; we're not a 24-hour hospital.",
     a_hi: "मेडिकल इमरजेंसी में कृपया 108 पर एम्बुलेंस बुलाइए। क्लिनिक के खुले समय में अर्जेंट वॉक-इन देखते हैं; हम 24 घंटे का अस्पताल नहीं हैं।",
     a_te: "వైద్య అత్యవసర పరిస్థితిలో దయచేసి 108కి అంబులెన్స్ కోసం కాల్ చేయండి. క్లినిక్ తెరిచి ఉన్న సమయంలో అత్యవసర వాక్-ఇన్ చూస్తాము; మేము 24 గంటల ఆసుపత్రి కాదు.",
     k_hi: "इमरजेंसी आपात एम्बुलेंस अर्जेंट रात",
     k_te: "అత్యవసర అంబులెన్స్ ఎమర్జెన్సీ రాత్రి"}
  - {q: "Is there a discount for senior citizens?", tags: ["senior","discount","offer","concession"], a: "Yes, senior citizens (60+) get 10% off consultations and health packages. Please carry an age proof.",
     a_hi: "जी हाँ, 60 वर्ष से ऊपर के वरिष्ठ नागरिकों को परामर्श और हेल्थ पैकेज पर 10% छूट मिलती है। कृपया उम्र का प्रमाण साथ लाइए।",
     a_te: "అవును, 60 ఏళ్లు పైబడిన సీనియర్ సిటిజన్లకు సంప్రదింపు మరియు హెల్త్ ప్యాకేజీలపై 10% తగ్గింపు. దయచేసి వయస్సు రుజువు తీసుకురండి.",
     k_hi: "छूट डिस्काउंट सीनियर बुजुर्ग वरिष्ठ ऑफर",
     k_te: "తగ్గింపు డిస్కౌంట్ సీనియర్ వృద్ధులు ఆఫర్"}
  - {q: "How long is the waiting time?", tags: ["wait","waiting","how long","queue"], a: "With an appointment, usually under 15 minutes. Walk-ins may wait 20–40 minutes depending on the rush.",
     a_hi: "अपॉइंटमेंट के साथ आमतौर पर 15 मिनट से कम। बिना अपॉइंटमेंट भीड़ के हिसाब से 20 से 40 मिनट लग सकते हैं।",
     a_te: "అపాయింట్‌మెంట్‌తో సాధారణంగా 15 నిమిషాల లోపు. అపాయింట్‌మెంట్ లేకుంటే రద్దీని బట్టి 20 నుండి 40 నిమిషాలు పట్టవచ్చు.",
     k_hi: "इंतज़ार वेटिंग कितनी देर लाइन भीड़",
     k_te: "వేచి వెయిటింగ్ ఎంతసేపు లైన్ రద్దీ"}
  - {q: "Can I get a second opinion?", tags: ["second opinion","review","another doctor"], a: "Absolutely — bring your reports and we'll arrange a consultation with the relevant specialist."}
  - {q: "Do you treat children / is there a pediatrician?", tags: ["child","children","kids","pediatric","baby"], a: "Yes, Dr Fernandes (Pediatrics) consults Monday to Saturday mornings, 10am to 1pm.",
     a_hi: "जी हाँ, डॉ. फर्नांडिस (बाल रोग) सोमवार से शनिवार सुबह 10 से दोपहर 1 बजे तक देखते हैं।",
     a_te: "అవును, డాక్టర్ ఫెర్నాండెస్ (పిల్లల వైద్యం) సోమవారం నుండి శనివారం ఉదయం 10 నుండి మధ్యాహ్నం 1 వరకు చూస్తారు.",
     k_hi: "बच्चा बच्चे बाल पीडियाट्रिक शिशु",
     k_te: "పిల్లలు బాల పీడియాట్రిక్ శిశు"}
  - {q: "How can I share feedback or a complaint?", tags: ["feedback","complaint","review","grievance"], a: "You can share feedback at the desk, on WhatsApp, or by email at care@suvidhaclinic.example. Our manager reviews every message."}
  - {q: "Are you open on public holidays?", tags: ["holiday","festival","public holiday","closed"], a: "We stay open on most working days; on major public holidays we run reduced hours (10am–1pm). Please call ahead to confirm."}
  - {q: "I have a fever / cold / infection, which doctor?", tags: ["fever","cold","cough","infection","viral","flu","body","ache"], a: "For fever, cold, cough or infections, see Dr Sharma, our General Physician, Monday to Saturday 9am to 2pm. Shall I book you a slot?",
     a_hi: "बुखार, सर्दी, खांसी या इन्फेक्शन के लिए डॉ. शर्मा, हमारे जनरल फिजिशियन, सोमवार से शनिवार सुबह 9 से दोपहर 2 बजे तक देखते हैं। क्या मैं स्लॉट बुक कर दूँ?",
     a_te: "జ్వరం, జలుబు, దగ్గు లేదా ఇన్ఫెక్షన్ కోసం డాక్టర్ శర్మ, మా జనరల్ ఫిజీషియన్, సోమవారం నుండి శనివారం ఉదయం 9 నుండి మధ్యాహ్నం 2 వరకు చూస్తారు. స్లాట్ బుక్ చేయమంటారా?",
     k_hi: "बुखार सर्दी खांसी जुकाम इन्फेक्शन वायरल फ्लू बदन दर्द तबीयत",
     k_te: "జ్వరం జలుబు దగ్గు ఇన్ఫెక్షన్ వైరల్ ఫ్లూ ఒళ్లు నొప్పి"}
  - {q: "I have stomach pain / acidity, which doctor?", tags: ["stomach","pain","acidity","gas","digestion","vomiting","loose","motion"], a: "For stomach pain, acidity or digestion trouble, our General Physician Dr Sharma can see you, 9am to 2pm Monday to Saturday. If the pain is severe or sudden, please tell me and I'll get help right away.",
     a_hi: "पेट दर्द, एसिडिटी या पाचन की तकलीफ़ के लिए हमारे जनरल फिजिशियन डॉ. शर्मा सोमवार से शनिवार सुबह 9 से दोपहर 2 बजे देखते हैं। अगर दर्द बहुत तेज़ है तो मुझे बताइए, मैं तुरंत मदद करवाती हूँ।",
     a_te: "కడుపు నొప్పి, ఎసిడిటీ లేదా జీర్ణ సమస్యల కోసం మా జనరల్ ఫిజీషియన్ డాక్టర్ శర్మ సోమవారం నుండి శనివారం ఉదయం 9 నుండి మధ్యాహ్నం 2 వరకు చూస్తారు. నొప్పి ఎక్కువగా ఉంటే చెప్పండి, వెంటనే సహాయం చేస్తాను.",
     k_hi: "पेट दर्द एसिडिटी गैस पाचन उल्टी दस्त पेटदर्द",
     k_te: "కడుపు నొప్పి ఎసిడిటీ గ్యాస్ జీర్ణ వాంతులు విరేచనాలు"}
  - {q: "I have a skin problem / rash / hair fall", tags: ["skin","rash","acne","pimple","hair","fall","allergy","itching"], a: "For skin, hair, acne or allergy problems, Dr Priya Mehta, our Dermatologist, consults 3pm to 8pm, Monday to Saturday. Consultation is ₹700.",
     a_hi: "त्वचा, बाल, मुहांसे या एलर्जी की समस्या के लिए डॉ. प्रिया मेहता, हमारी त्वचा रोग विशेषज्ञ, सोमवार से शनिवार दोपहर 3 से रात 8 बजे तक देखती हैं। फ़ीस ₹700 है।",
     a_te: "చర్మం, జుట్టు, మొటిమలు లేదా అలర్జీ సమస్యల కోసం డాక్టర్ ప్రియా మెహతా, మా చర్మ వైద్య నిపుణురాలు, సోమవారం నుండి శనివారం మధ్యాహ్నం 3 నుండి రాత్రి 8 వరకు చూస్తారు. ఫీజు ₹700.",
     k_hi: "त्वचा स्किन बाल झड़ना मुहांसे एलर्जी खुजली दाने",
     k_te: "చర్మం స్కిన్ జుట్టు మొటిమలు అలర్జీ దురద"}
  - {q: "My child is unwell", tags: ["child","kid","baby","fever","pediatric","vaccination"], a: "Dr Fernandes, our Paediatrician, sees children Monday to Saturday, 10am to 1pm. Consultation is ₹600. Shall I book a slot?",
     a_hi: "डॉ. फर्नांडिस, हमारे बाल रोग विशेषज्ञ, सोमवार से शनिवार सुबह 10 से दोपहर 1 बजे तक बच्चों को देखते हैं। फ़ीस ₹600 है। क्या स्लॉट बुक कर दूँ?",
     a_te: "డాక్టర్ ఫెర్నాండెస్, మా పిల్లల వైద్యుడు, సోమవారం నుండి శనివారం ఉదయం 10 నుండి మధ్యాహ్నం 1 వరకు పిల్లలను చూస్తారు. ఫీజు ₹600. స్లాట్ బుక్ చేయమంటారా?",
     k_hi: "बच्चा बच्चे बेटा बेटी शिशु बुखार",
     k_te: "పిల్లవాడు పిల్లలు బాబు పాప శిశు"}
  - {q: "I am pregnant / need a gynaecologist", tags: ["pregnancy","gynaec","women","ladies","doctor","period"], a: "Dr Iyer, our Gynaecologist, consults on Monday, Wednesday and Friday from 11am to 2pm. Consultation is ₹700.",
     a_hi: "डॉ. अय्यर, हमारी स्त्री रोग विशेषज्ञ, सोमवार, बुधवार और शुक्रवार सुबह 11 से दोपहर 2 बजे तक देखती हैं। फ़ीस ₹700 है।",
     a_te: "డాక్టర్ అయ్యర్, మా స్త్రీ వైద్య నిపుణురాలు, సోమ, బుధ, శుక్రవారం ఉదయం 11 నుండి మధ్యాహ్నం 2 వరకు చూస్తారు. ఫీజు ₹700.",
     k_hi: "गर्भवती प्रेगनेंसी स्त्री रोग महिला लेडी डॉक्टर पीरियड",
     k_te: "గర్భిణి ప్రెగ్నెన్సీ స్త్రీ మహిళా లేడీ డాక్టర్"}
  - {q: "Is a slot available today / right now?", tags: ["today","now","available","slot","earliest","soonest"], a: "I can check today's slots for you. May I have your name and mobile number, and which doctor you'd like to see?",
     a_hi: "मैं आज के स्लॉट देख सकती हूँ। कृपया अपना नाम, मोबाइल नंबर और बताइए किस डॉक्टर को दिखाना है?",
     a_te: "నేను ఈరోజు స్లాట్లు చూడగలను. దయచేసి మీ పేరు, మొబైల్ నంబర్ మరియు ఏ డాక్టర్‌ను చూడాలో చెప్పండి?",
     k_hi: "आज अभी तुरंत जल्दी खाली स्लॉट मिलेगा",
     k_te: "ఈరోజు ఇప్పుడు వెంటనే త్వరగా ఖాళీ స్లాట్"}
  - {q: "Can I change or cancel my appointment?", tags: ["change","cancel","reschedule","postpone","shift","appointment"], a: "Yes, you can reschedule or cancel free of charge up to 2 hours before. May I have the name and mobile number on the booking?",
     a_hi: "जी हाँ, अपॉइंटमेंट से 2 घंटे पहले तक बिना शुल्क बदल या रद्द कर सकते हैं। कृपया बुकिंग वाला नाम और मोबाइल नंबर बताइए।",
     a_te: "అవును, అపాయింట్‌మెంట్‌కు 2 గంటల ముందు వరకు ఉచితంగా మార్చుకోవచ్చు లేదా రద్దు చేసుకోవచ్చు. బుకింగ్‌లోని పేరు, మొబైల్ నంబర్ చెప్పండి.",
     k_hi: "बदलना रद्द कैंसिल रीशेड्यूल टालना आगे",
     k_te: "మార్చడం రద్దు క్యాన్సిల్ వాయిదా"}
  - {q: "Is a female doctor available?", tags: ["female","lady","woman","doctor","madam"], a: "Yes — Dr Priya Mehta (Dermatology) and Dr Iyer (Gynaecology) are both women doctors. Would you like an appointment with either?",
     a_hi: "जी हाँ — डॉ. प्रिया मेहता (त्वचा रोग) और डॉ. अय्यर (स्त्री रोग) दोनों महिला डॉक्टर हैं। क्या इनमें से किसी से अपॉइंटमेंट चाहिए?",
     a_te: "అవును — డాక్టర్ ప్రియా మెహతా (చర్మ వైద్యం) మరియు డాక్టర్ అయ్యర్ (స్త్రీ వైద్యం) ఇద్దరూ మహిళా వైద్యులు. వారితో అపాయింట్‌మెంట్ కావాలా?",
     k_hi: "महिला लेडी औरत डॉक्टर मैडम",
     k_te: "మహిళా లేడీ స్త్రీ డాక్టర్ మేడమ్"}
  - {q: "Is there wheelchair access / a lift?", tags: ["wheelchair","lift","stairs","disabled","elderly","access"], a: "Yes, there's lift access to the clinic and a wheelchair available at the entrance. Please tell the front desk when you arrive.",
     a_hi: "जी हाँ, क्लिनिक तक लिफ्ट है और प्रवेश पर व्हीलचेयर उपलब्ध है। आने पर फ्रंट डेस्क को बता दीजिए।",
     a_te: "అవును, క్లినిక్‌కు లిఫ్ట్ ఉంది మరియు ప్రవేశ ద్వారం వద్ద వీల్‌చైర్ అందుబాటులో ఉంది. వచ్చినప్పుడు ఫ్రంట్ డెస్క్‌కు చెప్పండి.",
     k_hi: "व्हीलचेयर लिफ्ट सीढ़ी दिव्यांग बुजुर्ग",
     k_te: "వీల్‌చైర్ లిఫ్ట్ మెట్లు వికలాంగ వృద్ధ"}
  - {q: "Are you open right now / today?", tags: ["open","now","today","closed","holiday","sunday"], a: "We're open Monday to Saturday 9am to 8pm, with a lunch break from 2 to 3pm, and Sunday 9am to 1pm for emergencies only.",
     a_hi: "हम सोमवार से शनिवार सुबह 9 से रात 8 बजे तक खुले हैं, दोपहर 2 से 3 बजे लंच ब्रेक। रविवार सुबह 9 से दोपहर 1 बजे तक सिर्फ़ इमरजेंसी।",
     a_te: "మేము సోమవారం నుండి శనివారం ఉదయం 9 నుండి రాత్రి 8 వరకు తెరిచి ఉంటాము, మధ్యాహ్నం 2 నుండి 3 వరకు విరామం. ఆదివారం ఉదయం 9 నుండి మధ్యాహ్నం 1 వరకు అత్యవసరం మాత్రమే.",
     k_hi: "खुला बंद अभी आज छुट्टी रविवार",
     k_te: "తెరిచి మూసి ఇప్పుడు ఈరోజు సెలవు ఆదివారం"}
  - {q: "Can I get a receipt / bill for insurance?", tags: ["receipt","bill","invoice","gst","claim","reimbursement"], a: "Yes, the front desk gives a printed receipt for every consultation and test, which you can use for insurance reimbursement.",
     a_hi: "जी हाँ, हर परामर्श और जांच की छपी हुई रसीद फ्रंट डेस्क से मिलती है, जिसे आप इंश्योरेंस क्लेम के लिए इस्तेमाल कर सकते हैं।",
     a_te: "అవును, ప్రతి సంప్రదింపు మరియు పరీక్షకు ముద్రిత రసీదు ఫ్రంట్ డెస్క్‌లో ఇస్తారు, దానిని బీమా క్లెయిమ్‌కు ఉపయోగించవచ్చు.",
     k_hi: "रसीद बिल इनवॉइस जीएसटी क्लेम रीइम्बर्स",
     k_te: "రసీదు బిల్లు ఇన్వాయిస్ క్లెయిమ్"}
  - {q: "Do I need to fast before a blood test?", tags: ["fasting","empty","stomach","blood","test","khali","pet"], a: "For sugar and lipid tests, please come after 8 to 10 hours of fasting — early morning is easiest. For most other tests fasting isn't needed.",
     a_hi: "शुगर और लिपिड टेस्ट के लिए 8 से 10 घंटे खाली पेट आइए — सुबह जल्दी आना सबसे आसान है। ज़्यादातर दूसरे टेस्ट के लिए खाली पेट ज़रूरी नहीं।",
     a_te: "షుగర్ మరియు లిపిడ్ పరీక్షలకు 8 నుండి 10 గంటలు ఖాళీ కడుపుతో రండి — ఉదయం త్వరగా రావడం సులభం. చాలా ఇతర పరీక్షలకు ఖాళీ కడుపు అవసరం లేదు.",
     k_hi: "खाली पेट फास्टिंग भूखा ब्लड टेस्ट शुगर",
     k_te: "ఖాళీ కడుపు ఫాస్టింగ్ ఉపవాసం రక్త పరీక్ష షుగర్"}
  - {q: "How much does a blood test cost?", tags: ["blood","test","cost","price","cbc","thyroid","sugar","lipid","rate"], a: "Test prices vary by the panel — the front desk will confirm the exact amount for the tests your doctor advises. Common blood tests are done in-house with reports in 24 hours.",
     a_hi: "जांच की कीमत पैनल के हिसाब से अलग होती है — डॉक्टर जो टेस्ट लिखेंगे उनकी सही राशि फ्रंट डेस्क बता देगा। आम ब्लड टेस्ट यहीं होते हैं और रिपोर्ट 24 घंटे में मिलती है।",
     a_te: "పరీక్ష ధర ప్యానెల్‌ను బట్టి మారుతుంది — డాక్టర్ సూచించిన పరీక్షల ఖచ్చితమైన మొత్తాన్ని ఫ్రంట్ డెస్క్ చెబుతుంది. సాధారణ రక్త పరీక్షలు ఇక్కడే చేస్తారు, రిపోర్ట్ 24 గంటల్లో.",
     k_hi: "ब्लड टेस्ट कीमत खर्च सीबीसी थायरॉइड शुगर जांच दाम",
     k_te: "రక్త పరీక్ష ధర ఖర్చు సీబీసీ థైరాయిడ్ షుగర్"}
  - {q: "Can I speak to the doctor on the phone?", tags: ["talk","speak","doctor","phone","call","directly"], a: "Doctors don't take calls during consulting hours, but I can book you an appointment or a ₹400 video consultation. Which would you prefer?",
     a_hi: "परामर्श के समय डॉक्टर फ़ोन पर बात नहीं करते, पर मैं आपका अपॉइंटमेंट या ₹400 का वीडियो कंसल्टेशन बुक कर सकती हूँ। आपको क्या ठीक रहेगा?",
     a_te: "సంప్రదింపు సమయంలో డాక్టర్లు ఫోన్‌లో మాట్లాడరు, కానీ నేను అపాయింట్‌మెంట్ లేదా ₹400 వీడియో సంప్రదింపు బుక్ చేయగలను. మీకు ఏది సౌకర్యం?",
     k_hi: "डॉक्टर से बात फ़ोन कॉल सीधे बात करनी",
     k_te: "డాక్టర్‌తో మాట్లాడ ఫోన్ కాల్ నేరుగా"}
  - {q: "Where do I collect my medicines?", tags: ["medicine","pharmacy","chemist","collect","tablet"], a: "Our in-house pharmacy is open during clinic hours — you can collect your medicines there right after your consultation.",
     a_hi: "हमारी इन-हाउस फ़ार्मेसी क्लिनिक के समय में खुली रहती है — परामर्श के तुरंत बाद वहीं से दवाइयाँ ले सकते हैं।",
     a_te: "మా ఇన్-హౌస్ ఫార్మసీ క్లినిక్ సమయంలో తెరిచి ఉంటుంది — సంప్రదింపు తర్వాత అక్కడే మందులు తీసుకోవచ్చు.",
     k_hi: "दवा दवाई मेडिसिन फार्मेसी गोली लेना",
     k_te: "మందు మెడిసిన్ ఫార్మసీ మాత్ర తీసుకో"}
