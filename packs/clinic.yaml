  - {q: "How much do tests like ECG, X-ray or ultrasound cost?", tags: ["ecg","x-ray","xray","ultrasound","scan","test","price","cost","rate"], a: "ECG is ₹300, X-ray ₹400, ultrasound ₹900. Common blood tests: CBC ₹350, thyroid ₹600, lipid profile ₹700, blood sugar ₹150. Reports come within 24 hours.",
     a_hi: "ईसीजी ₹300, एक्स-रे ₹400, अल्ट्रासाउंड ₹900। आम ब्लड टेस्ट: सीबीसी ₹350, थायरॉइड ₹600, लिपिड प्रोफ़ाइल ₹700, शुगर ₹150। रिपोर्ट 24 घंटे में मिल जाती है।",
     a_te: "ఈసీజీ ₹300, ఎక్స్-రే ₹400, అల్ట్రాసౌండ్ ₹900. సాధారణ రక్త పరీక్షలు: సీబీసీ ₹350, థైరాయిడ్ ₹600, లిపిడ్ ప్రొఫైల్ ₹700, షుగర్ ₹150. రిపోర్ట్ 24 గంటల్లో వస్తుంది.",
     k_hi: "ईसीजी एक्सरे एक्स रे अल्ट्रासाउंड सोनोग्राफी जांच टेस्ट कितने पैसे दाम रेट",
     k_te: "ఈసీజీ ఎక్స్ రే అల్ట్రాసౌండ్ స్కాన్ పరీక్ష ఎంత ధర రేటు"}
  - {q: "How long does a consultation take?", tags: ["how long","duration","time","consultation","minutes"], a: "A first consultation usually takes 15 to 20 minutes, and a follow-up about 10 minutes. Please arrive 10 minutes early for registration.",
     a_hi: "पहला परामर्श आम तौर पर 15 से 20 मिनट का होता है, फ़ॉलो-अप लगभग 10 मिनट। रजिस्ट्रेशन के लिए 10 मिनट पहले आ जाइए।",
     a_te: "మొదటి సంప్రదింపు సాధారణంగా 15 నుండి 20 నిమిషాలు, ఫాలో-అప్ దాదాపు 10 నిమిషాలు. రిజిస్ట్రేషన్ కోసం 10 నిమిషాలు ముందుగా రండి.",
     k_hi: "कितनी देर कितना समय लगेगा मिनट परामर्श चलता",
     k_te: "ఎంత సేపు ఎంత సమయం నిమిషాలు పడుతుంది"}
  - {q: "Will I get a reminder before my appointment?", tags: ["reminder","sms","confirmation","message","remind"], a: "Yes — you get a confirmation SMS as soon as we book you, and a WhatsApp reminder on the morning of your appointment.",
     a_hi: "जी हाँ — बुकिंग होते ही कन्फ़र्मेशन एसएमएस आ जाता है, और अपॉइंटमेंट वाले दिन सुबह व्हाट्सएप पर याद दिला देते हैं।",
     a_te: "అవును — బుకింగ్ కాగానే కన్ఫర్మేషన్ ఎస్ఎంఎస్ వస్తుంది, అపాయింట్‌మెంట్ రోజు ఉదయం వాట్సాప్‌లో గుర్తు చేస్తాము.",
     k_hi: "रिमाइंडर याद एसएमएस मैसेज कन्फर्मेशन सूचना",
     k_te: "రిమైండర్ గుర్తు ఎస్ఎంఎస్ మెసేజ్ కన్ఫర్మేషన్"}
  - {q: "Can I get a medical or fitness certificate?", tags: ["certificate","fitness","medical certificate","sick leave","job","fit"], a: "Yes, our General Physician issues fitness and sick-leave certificates after an examination — ₹300 in addition to the consultation. Please bring a photo ID.",
     a_hi: "जी हाँ, हमारे जनरल फिजिशियन जाँच के बाद फ़िटनेस और बीमारी की छुट्टी का सर्टिफ़िकेट देते हैं — परामर्श शुल्क के अलावा ₹300। फोटो आईडी साथ लाइए।",
     a_te: "అవును, మా జనరల్ ఫిజీషియన్ పరీక్ష తర్వాత ఫిట్‌నెస్ మరియు సిక్ లీవ్ సర్టిఫికెట్ ఇస్తారు — సంప్రదింపు రుసుముతో పాటు ₹300. ఫోటో ఐడీ తీసుకురండి.",
     k_hi: "सर्टिफिकेट प्रमाणपत्र फिटनेस मेडिकल छुट्टी बीमारी नौकरी",
     k_te: "సర్టిఫికెట్ ధృవీకరణ ఫిట్‌నెస్ మెడికల్ సెలవు ఉద్యోగం"}
  - {q: "Do you give travel vaccinations?", tags: ["travel","vaccination","abroad","yellow fever","passport","visa"], a: "We give routine vaccinations for children and adults, but not travel-specific ones like yellow fever — those need an authorised travel-vaccination centre. Dr Sharma can advise you on what you need.",
     a_hi: "हम बच्चों और बड़ों के नियमित टीके लगाते हैं, पर पीले बुख़ार जैसे यात्रा वाले टीके नहीं — उनके लिए अधिकृत ट्रैवल वैक्सीनेशन सेंटर चाहिए। डॉ. शर्मा बता सकते हैं कि आपको क्या चाहिए।",
     a_te: "మేము పిల్లలకు, పెద్దలకు సాధారణ టీకాలు వేస్తాము, కానీ ఎల్లో ఫీవర్ వంటి ప్రయాణ టీకాలు వేయము — వాటికి అధీకృత ట్రావెల్ వ్యాక్సినేషన్ సెంటర్ అవసరం. డాక్టర్ శర్మ మీకు ఏమి కావాలో చెప్పగలరు.",
     k_hi: "यात्रा ट्रैवल विदेश टीका वैक्सीन पीला बुखार वीज़ा पासपोर्ट",
     k_te: "ప్రయాణ ట్రావెల్ విదేశ టీకా వ్యాక్సిన్ ఎల్లో ఫీవర్ వీసా"}
  - {q: "How do I get an old report from a previous visit?", tags: ["old","previous","past","last year","archive","duplicate","copy"], a: "We keep records for three years. Give the front desk the patient's name and mobile number and we'll send a copy on WhatsApp the same day, or print it for ₹50.",
     a_hi: "हम तीन साल तक रिकॉर्ड रखते हैं। फ्रंट डेस्क पर मरीज़ का नाम और मोबाइल नंबर बताइए — उसी दिन व्हाट्सएप पर कॉपी भेज देंगे, या ₹50 में प्रिंट कर देंगे।",
     a_te: "మేము మూడు సంవత్సరాలు రికార్డులు ఉంచుతాము. ఫ్రంట్ డెస్క్‌లో రోగి పేరు, మొబైల్ నంబర్ ఇవ్వండి — అదే రోజు వాట్సాప్‌లో కాపీ పంపుతాము, లేదా ₹50కి ప్రింట్ ఇస్తాము.",
     k_hi: "पुरानी रिपोर्ट पिछली साल पहले कॉपी डुप्लीकेट दोबारा",
     k_te: "పాత రిపోర్ట్ గత సంవత్సరం కాపీ డూప్లికేట్ మళ్ళీ"}
  - {q: "Can someone else collect my report for me?", tags: ["someone else","collect","behalf","family","authorise","pick up"], a: "Yes — they need to bring a copy of the patient's ID, and we'll confirm by calling the number on file before handing it over.",
     a_hi: "जी हाँ — उन्हें मरीज़ की आईडी की कॉपी लानी होगी, और देने से पहले हम रजिस्टर्ड नंबर पर कॉल करके पुष्टि कर लेंगे।",
     a_te: "అవును — వారు రోగి ఐడీ కాపీ తీసుకురావాలి, ఇచ్చే ముందు మేము రిజిస్టర్ చేసిన నంబర్‌కు కాల్ చేసి నిర్ధారిస్తాము.",
     k_hi: "कोई और दूसरा लेने भेज सकते परिवार तरफ से",
     k_te: "వేరే వ్యక్తి తీసుకోవచ్చా కుటుంబం తరపున"}
  - {q: "Can two people be seen on one appointment?", tags: ["two people","both","together","family","same appointment","another person"], a: "Each appointment is for one patient, so please book a separate slot for each person — we can do them back to back with the same doctor.",
     a_hi: "एक अपॉइंटमेंट एक ही मरीज़ के लिए होता है, इसलिए हर व्यक्ति के लिए अलग स्लॉट बुक कीजिए — एक ही डॉक्टर के साथ एक के बाद एक रख सकते हैं।",
     a_te: "ఒక అపాయింట్‌మెంట్ ఒక రోగికి మాత్రమే, కాబట్టి ప్రతి వ్యక్తికి వేరే స్లాట్ బుక్ చేయండి — ఒకే డాక్టర్‌తో వరుసగా ఇవ్వగలము.",
     k_hi: "दो लोग दोनों साथ एक साथ परिवार एक ही अपॉइंटमेंट",
     k_te: "ఇద్దరు కలిసి ఒకేసారి కుటుంబం ఒకే అపాయింట్‌మెంట్"}
  - {q: "What happens if the doctor is running late?", tags: ["late","delay","waiting","doctor late","running behind"], a: "If a doctor is delayed we call you before you set out, and you can wait, take the next available slot, or reschedule at no charge.",
     a_hi: "अगर डॉक्टर को देर हो रही हो तो हम आपके निकलने से पहले फ़ोन कर देते हैं — आप इंतज़ार कर सकते हैं, अगला स्लॉट ले सकते हैं, या बिना किसी शुल्क के दूसरा दिन तय कर सकते हैं।",
     a_te: "డాక్టర్‌కు ఆలస్యమైతే మీరు బయలుదేరే ముందే ఫోన్ చేస్తాము — మీరు వేచి ఉండవచ్చు, తర్వాతి స్లాట్ తీసుకోవచ్చు, లేదా ఎలాంటి రుసుము లేకుండా వేరే రోజుకు మార్చుకోవచ్చు.",
     k_hi: "डॉक्टर देर लेट देरी इंतज़ार नहीं आए",
     k_te: "డాక్టర్ ఆలస్యం లేట్ వేచి రాలేదు"}
  - {q: "Is there a follow-up charge?", tags: ["follow up","followup","revisit","again","second visit","review"], a: "A follow-up for the same complaint within 7 days is free. After that the normal consultation fee applies.",
     a_hi: "उसी शिकायत के लिए 7 दिन के भीतर फ़ॉलो-अप मुफ़्त है। उसके बाद सामान्य परामर्श शुल्क लगेगा।",
     a_te: "అదే సమస్యకు 7 రోజుల్లోపు ఫాలో-అప్ ఉచితం. ఆ తర్వాత సాధారణ సంప్రదింపు రుసుము వర్తిస్తుంది.",
     k_hi: "फॉलो अप दोबारा दुबारा फिर से दूसरी बार शुल्क",
     k_te: "ఫాలో అప్ మళ్ళీ రెండోసారి రుసుము"}
  - {q: "How do I reach you by bus or auto?", tags: ["bus","auto","rickshaw","transport","metro","train","station","stop"], a: "The nearest bus stop is Sarasbaug, a two-minute walk away, and any auto in Camp will know Sarasbaug. Pune station is about 4km.",
     a_hi: "सबसे नज़दीकी बस स्टॉप सारसबाग है, दो मिनट की पैदल दूरी पर — कैंप का कोई भी ऑटो सारसबाग जानता है। पुणे स्टेशन लगभग 4 किलोमीटर दूर है।",
     a_te: "దగ్గరి బస్ స్టాప్ సారస్‌బాగ్, రెండు నిమిషాల నడక — క్యాంప్‌లోని ఏ ఆటో అయినా సారస్‌బాగ్ తెలుసు. పూణే స్టేషన్ దాదాపు 4 కిలోమీటర్లు.",
     k_hi: "बस ऑटो रिक्शा स्टॉप स्टेशन मेट्रो कैसे आएं पहुंचें",
     k_te: "బస్ ఆటో రిక్షా స్టాప్ స్టేషన్ ఎలా రావాలి"}
  - {q: "Is the first visit free?", tags: ["first visit","free","every time","charge again","new patient"], a: "No, the consultation fee applies on every visit — ₹500 for the General Physician, and the specialist rates for other departments. Registration itself is free.",
     a_hi: "नहीं, हर बार परामर्श शुल्क लगता है — जनरल फिजिशियन ₹500, बाक़ी विभागों के लिए उनकी दर। रजिस्ट्रेशन मुफ़्त है।",
     a_te: "కాదు, ప్రతిసారీ సంప్రదింపు రుసుము వర్తిస్తుంది — జనరల్ ఫిజీషియన్ ₹500, ఇతర విభాగాలకు వాటి రేట్లు. రిజిస్ట్రేషన్ ఉచితం.",
     k_hi: "पहली बार मुफ्त फ्री हर बार दोबारा पैसे रजिस्ट्रेशन",
     k_te: "మొదటిసారి ఉచితం ఫ్రీ ప్రతిసారి రిజిస్ట్రేషన్"}
