  role: "the front-desk receptionist"
  style: "calm, caring, and reassuring"
business:
  name: "Suvidha Clinic & Diagnostics"
  tagline: "Trusted family healthcare in Pune since 2009"
  established: "2009 (15+ years of service)"
  hours: "Mon–Sat 9am–8pm; Sunday 9am–1pm (emergencies only). Lunch break 2–3pm."
  address: "12 MG Road, Camp, Pune 411001"
  landmark: "opposite Sarasbaug, above HDFC Bank"
  phone: "+91 20 1234 5678"
  whatsapp: "+91 98765 43210"
  email: "care@suvidhaclinic.example"
  website: "suvidhaclinic.example"
  parking: "free two-wheeler parking; paid car parking next door"
  payment: "UPI, cards, cash; cashless insurance accepted"
  # Native-script copies. When the caller speaks this language the engine hands these to
  # the model so it QUOTES instead of translating (see Session.native_facts).
  name_hi: "सुविधा क्लिनिक एंड डायग्नोस्टिक्स"
  name_te: "సువిధా క్లినిక్ అండ్ డయాగ్నోస్టిక్స్"
  hours_hi: "सोमवार से शनिवार सुबह 9 से रात 8 बजे तक; रविवार सुबह 9 से दोपहर 1 बजे तक केवल इमरजेंसी। दोपहर 2 से 3 बजे तक लंच ब्रेक।"
  hours_te: "సోమవారం నుండి శనివారం ఉదయం 9 నుండి రాత్రి 8 వరకు; ఆదివారం ఉదయం 9 నుండి మధ్యాహ్నం 1 వరకు అత్యవసర సేవలు మాత్రమే. మధ్యాహ్నం 2 నుండి 3 వరకు విరామం."
  address_hi: "12 एमजी रोड, कैंप, पुणे 411001 — सारसबाग के सामने, एचडीएफसी बैंक के ऊपर।"
  address_te: "12 ఎంజీ రోడ్, క్యాంప్, పూణే 411001 — సారస్‌బాగ్ ఎదురుగా, హెచ్‌డీఎఫ్‌సీ బ్యాంక్ పైన."
greeting: "Namaste, thank you for calling Suvidha Clinic. How may I help you today?"

booking:
  required: [name, phone, doctor, datetime]

  # Spoken forms of each doctor/department, in every script a caller may use. The engine
  # matches these against the caller's OWN words and fills the `doctor` slot itself —
  # a caller who says "डॉक्टर अनिल शर्मा" three times must never be asked a fourth time.
  slot_aliases:
    doctor:
      "General Physician — Dr Anil Sharma": ["dr sharma", "anil sharma", "sharma", "general physician",
        "अनिल शर्मा", "शर्मा", "जनरल फिजिशियन", "जनरल फीजीशियन", "फिजिशियन",
        "అనిల్ శర్మ", "శర్మ", "జనరల్ ఫిజీషియన్"]
      "Dermatology — Dr Priya Mehta": ["dr mehta", "priya mehta", "mehta", "dermatology", "skin",
        "प्रिया मेहता", "मेहता", "त्वचा", "स्किन", "डर्मेटोलॉजी",
        "ప్రియా మెహతా", "మెహతా", "చర్మ", "డెర్మటాలజీ"]
      "Cardiology — Dr Rao": ["dr rao", "rao", "cardiology", "heart",
        "राव", "राओ", "हृदय", "दिल", "कार्डियोलॉजी",
        "రావు", "గుండె", "కార్డియాలజీ"]
      "Pediatrics — Dr Fernandes": ["dr fernandes", "fernandes", "pediatrics", "paediatrics", "child",
        "फर्नांडिस", "फर्नांडेस", "बाल रोग", "बच्चों", "पेडिएट्रिक",
        "ఫెర్నాండెస్", "పిల్లల", "పీడియాట్రిక్"]
      "Gynaecology — Dr Iyer": ["dr iyer", "iyer", "gynaecology", "gynecology",
        "अय्यर", "आईयर", "स्त्री रोग", "गायनेक",
        "అయ్యర్", "స్త్రీ", "గైనకాలజీ"]
  slots:
    name: "May I have the patient's full name?"
    phone: "What mobile number should we use for confirmation?"
    doctor: "Which doctor or department — General Physician, Skin, Cardiology, Pediatrics, or Gynaecology?"
    datetime: "What day and time would suit you? We have slots through the day."

vocabulary: ["appointment","doctor","fever","MRI","X-ray","ultrasound","ECG","physician","dermatologist",
             "cardiologist","pediatrician","gynaecologist","prescription","report","blood test","CBC","thyroid",
             "diabetes","BP","Dr Sharma","Dr Mehta","Dr Rao","Dr Iyer","Dr Fernandes","vaccination","follow-up"]

