# ZenSuvidha OSS configuration — every provider here is free & self-hosted.
# Swap providers/models freely; the engine is provider-agnostic.

stt:
  provider: auto             # auto | whisper_cpp_server | whisper_cpp | faster_whisper | none
                             #   auto tries the best thing THIS machine has, in order,
                             #   and silently falls back. Nothing to configure, nothing
                             #   to deploy. MEASURED, all warmed, best of 5 in one
                             #   process, on an M1 Pro with the small model:
                             #
                             #     clip    faster-whisper  whisper-cli  whisper-server
                             #     0.3s            1420ms       895ms          615ms
                             #     3.5s            1738ms       841ms          621ms
                             #    10.5s            1674ms       903ms          670ms
                             #
                             #   The SERVER keeps the model resident, so it pays neither
                             #   the process spawn nor the 490MB load per turn — and it
                             #   is the only whisper.cpp mode that reports confidence
                             #   numbers, so the artifact guard and language latching
                             #   work there exactly as on faster-whisper. It is started
                             #   as a CHILD of this process on a free loopback port and
                             #   killed on exit: local, nothing left listening.
                             #
                             #   A curl probe suggested 4x; the real figure measured
                             #   through the shipping code path is 2.3-2.8x. Whisper's
                             #   encoder runs on a padded 30s window whatever the clip
                             #   length, which is also why 0.3s is not cheaper than 3.5s.
  # ---- two-pass: a tiny model for the GUESS, the accurate one for the TURN ----------
  # The speculative frame taken at ~450ms of silence exists to size the endpoint window
  # and show live text — three turn-taking signals are computed from it and nothing else
  # (looks_incomplete, looks_complete, the pitch contour). All three were gated behind a
  # full 621ms recognition, so the endpointer could not react until the caller had
  # already been silent for most of the window it was trying to size.
  # The partial NEVER reaches the LLM, the guard, or the transcript — `tiny` is
  # measurably worse and its errors must not reach a booking.
  # Set to null to use one model for both passes.
  partial_model: models/whispercpp/ggml-tiny.bin
  partial_provider: null     # null = same ladder as `provider` (auto)
  whispercpp_url: null       # point at an already-running whisper-server instead of
                             #   spawning one (e.g. http://127.0.0.1:8080)
  whispercpp_server_bin: null  # null = find `whisper-server` on PATH
  whispercpp_boot_timeout: 90  # seconds to wait for the model to load at startup
  device: auto               # auto | cpu | cuda — auto picks CUDA when a card is present,
                             #   else CPU. NOT mps: measured, SpeechBrain's ECAPA fails
                             #   outright on it and CTranslate2 does not use it. Apple's
                             #   GPU is reached through whisper.cpp's Metal backend, which
                             #   is a separate process and needs no torch device.
  # ---- whisper_cpp: the same Whisper model, decoded on the GPU already in the box ----
  # STT is the dominant cost on the audio path (1070ms at 3s of speech, against 66ms for
  # isolation and 34ms for the speaker gate) and every CPU-side lever has been measured
  # and rejected — more CTranslate2 threads is WORSE on an M1 (auto 1691ms, 8 threads
  # 2212ms, 10 threads 3798ms) and greedy decoding was not reliably faster. The one
  # unused resource is the GPU, and whisper.cpp is how to reach it without a CUDA box.
  #
  # MEASURED here (M1 Pro, small, best of 2 warm runs):
  #     clip     faster-whisper   whisper.cpp   speedup
  #     3.5s            1562ms         833ms      1.87x
  #     7.0s            1488ms         797ms      1.87x
  #    10.5s            1519ms         876ms      1.73x
  #   …and mean WER 0.25 vs 0.29 over the same clips, so it is not paid for in accuracy.
  #
  # OPT-IN, not the default: it needs `brew install whisper-cpp` plus a 490MB model that
  # a git clone does not bring, and this project's premise is that cloning and running
  # works. Enable with:  bash scripts/download_whispercpp.sh  then provider: whisper_cpp
  # Falls back to faster_whisper by itself if the binary or the model is missing.
  whispercpp_bin: null       # null = find `whisper-cli` on PATH
  whispercpp_model: models/whispercpp/ggml-small.bin
  whispercpp_vad_model: null # null = look for models/whispercpp/ggml-silero*.bin.
                             #   It must be whisper.cpp's OWN ggml build — pointing this
                             #   at one of the three Silero .onnx files already in this
                             #   repo does not error, it ABORTS the process (SIGABRT),
                             #   which reads as a broken recogniser rather than a wrong file.
  whispercpp_threads: null   # null = performance-core count (2-8). MEASURED on this M1:
                             #   piling on threads makes it WORSE — CTranslate2 went
                             #   auto 1691ms, 4 threads 1601ms, 8 threads 2212ms, 10
                             #   threads 3798ms, because the efficiency cores drag.
  whispercpp_timeout: 60     # a wedged child must never hold a threadpool worker forever
  model: small               # tiny | base | small  (small ≈ 460MB, best CPU accuracy)
  language: null             # null = auto-detect the spoken language (multilingual). denoise+VAD guard the noise mis-fire; force "en"/"hi" to pin.
  compute_type: int8         # int8 (CPU) | float16 (GPU)
  beam_size: 3               # beam search width (5=most accurate/slow, 1=greedy/fastest). 3 = balanced.
  fast_beam_size: 1          # beam used in "fast" mode (greedy = lowest latency)

  vad_filter: true           # strip silence before STT → prevents "5,5,5…" hallucinations
  denoise: false             # OFF, and MEASURED: noisereduce changes the word-error rate by
                             #   0.00 across clean / white / fan-rumble / babble, down to 0dB SNR
                             #   (noise as loud as the speech). Whisper was trained on 680k hours
                             #   of messy audio and is already robust; spectral gating in front of
                             #   it removes speech detail without adding information. Leave it off
                             #   — the real noise rejection is Silero (browser) + vad_filter below.
  # ---- DeepFilterNet: live A/B toggle in the UI (default OFF) ----
  # MEASURED on this codebase and it does NOT help: Whisper WER 0.10 vs 0.00 raw,
  # speaker similarity 0.596 vs 0.675, and it won 0 of 10 conditions in an SNR sweep
  # from +20dB down to -5dB. Wired in anyway so the trade-off can be heard, not argued.
  # Set the backend, run `bash scripts/download_deepfilter.sh`, then use the
  # "DeepFilter" button in the UI to switch it per call.
  denoise_backend: deepfilternet   # deepfilternet | none  (the UI toggle needs this set)
  auto_denoise: false        # MEASURED OFF. Swept 6 interference types x 5 SNRs: DeepFilter
                             #   won 1 cell, lost 8, tied 21 (net -400% word recall) — and it
                             #   is the most expensive stage at 226-475ms. It costs time AND
                             #   accuracy on the recognition path. The UI toggle still forces
                             #   it on to hear the difference; set this true to let the room's
                             #   noise floor decide again.
  deepfilter_bin: models/deep-filter   # from scripts/download_deepfilter.sh
  deepfilter_atten_db: null  # how far it may suppress. null/100 = unlimited (tool default),
                             #   0 = no suppression. MEASURED: a CLEAN voice is safe even at
                             #   the default — 98% of energy kept down to a whisper (-26dB),
                             #   WER 0.00, voiceprint 0.99. What it DOES eat is speech mixed
                             #   INTO heavy noise (WER 0.15 -> 0.38 at -5dB SNR). Set 10-20
                             #   to bound how much of the caller can ever be removed.
  # Junk/phantom rejection — tuned so REAL Indian-language speech (lower Whisper confidence)
  # is never dropped; only clear non-speech / garbage is. Loosen further if it ever drops you.
  reject_no_speech: 0.85     # drop only if Whisper is quite sure the clip is NOT speech
  reject_logprob: -1.6       # drop only very-low-confidence (garbage) decodes
  # ---- speaker gate: answer only the person who called ----
  # Silero knows a sound is SPEECH; it cannot tell you WHOSE. Without this a colleague
  # across the room, or a television, opens a turn and gets answered as if they were the
  # caller. The first voice on the call is enrolled, and later utterances are compared
  # against it as an ECAPA voiceprint (cosine similarity).
  speaker_gate: true        # true = ignore voices other than the caller's
  speaker_backend: speechbrain   # speechbrain (ECAPA, ~80MB, best) | resemblyzer (~17MB)
  speaker_threshold: 0.55    # cosine similarity to accept. Lower = more permissive.
                             #   0.25 = same voice down a bad line; 0.55 = comfortable
                             #   margin; above ~0.7 starts rejecting the real caller when
                             #   they change tone or move away from the mic.
  speaker_model: speechbrain/spkrec-ecapa-voxceleb   # Apache-2.0, NOT a gated repo
  # ---- segment-level gating: keep the caller, drop whoever else spoke in the gaps ----
  # The whole-utterance gate above judges ONE verdict for the whole clip, which breaks on
  # the commonest real interference. MEASURED: a colleague speaking in a GAP drags
  # similarity 0.867 -> 0.34 and the caller's OWN turn is rejected, with the stranger's
  # words left in the transcript. With diarization on, the turn is split by speaker and
  # only the caller's parts reach Whisper: 0.364 REJ -> 0.872 ACCEPT, transcript 7.7s ->
  # 3.6s with the intruder removed. Impostor-only clips are still rejected.
  # (True simultaneous overlap does NOT need this — measured, the gate already copes.)
  # Needs speaker_gate: true, and: bash scripts/download_diarize.sh   (~45MB, ONNX)
  diarize: true
  diarize_segmentation: models/diarize/segmentation.onnx   # pyannote-segmentation-3.0, MIT
  diarize_embedding: models/diarize/embedding.onnx         # 3D-Speaker ERes2Net, Apache-2.0
  diarize_max_speakers: 3
  # The UI "Fast STT" toggle flips beam_size→fast_beam_size per call for lower latency.

llm:
  provider: ollama
  model: qwen3:4b            # DEFAULT = best MULTILINGUAL quality (proper Hindi/Telugu/Kannada).
                            #   qwen2.5:3b is faster but produces GARBLED Indian-language replies —
                            #   only use it for English-only deployments. `ollama pull qwen3:4b`.
                            #   On a GPU, qwen2.5:14B / qwen2.5:7B are better still (see config.gpu.yaml).
  think: false              # Qwen3 THINKING MODE OFF — its chain-of-thought adds seconds of dead
                            #   air on a call. Keep false for voice. (null = auto-off for qwen3.)
  base_url: http://localhost:11434
  temperature: 0.3           # lower = more faithful to the facts, less drift (esp. multilingual)
  keep_alive: "30m"          # keep the model resident in RAM between calls (latency)
  timeout: 120               # seconds
  retries: 2                 # transient-error retries with backoff
  num_predict: 200           # cap reply length. Enough for say + action.slots JSON without
                             #   truncating (truncation = empty/garbled replies); still terse.
  num_ctx: 12288             # room for the system prompt (~4k tokens on the clinic pack),
                             #   the caller's-language facts (~1k in Telugu) and the
                             #   conversation. At 6144 the prompt OVERFLOWED and Ollama
                             #   silently dropped the oldest messages — the agent lost its
                             #   own instructions mid-call and started looping.
                             #   Keep this CONSTANT: changing num_ctx between calls makes
                             #   Ollama reallocate its KV cache and reload the model
                             #   (every reply went from ~3s to ~16s).
  fast_model: null           # optional: route trivial turns (greetings, yes/no) to a
                             #   smaller/faster model, e.g. "qwen2.5:1.5b". null = disabled
                             #   (always use `model`). Only used when the caller hasn't
                             #   pinned a model in the UI. `ollama pull qwen2.5:1.5b` first.

tts:
  provider: kokoro           # system (pyttsx3) | piper | kokoro | indic_parler | clone | none
  # ---- cloning runs OUT OF PROCESS, and it has to ---------------------------------
  # `provider: clone` currently returns None on this install: coqui-tts needs a newer
  # `transformers` than the 4.46.1 pinned here, and that pin exists because parler-tts —
  # the Indic voice — requires exactly 4.46.1. The environment can host the Indic voice
  # or the in-process cloner, and it chose the voice. So the brand-voice feature has
  # been quietly unavailable.
  # Third collision of this shape (deepfilternet forced numpy<2 and broke SpeechBrain;
  # Qwen3-Embedding's transformers bump broke parler), and the project answered it the
  # same way twice: do not import it. DeepFilterNet is a binary we shell out to,
  # whisper.cpp is a server we talk to. Cloning is seconds per sentence and runs offline,
  # so a subprocess costs nothing that matters.
  #   python3 -m venv ~/.cache/zensuvidha-clone
  #   ~/.cache/zensuvidha-clone/bin/pip install voxcpm      # Apache-2.0, weights too
  clone_command: null        # e.g. ["~/.cache/zensuvidha-clone/bin/python", "scripts/clone_worker.py"]
  clone_timeout: 120         # a wedged worker must never hold a threadpool worker
  # WHY kokoro and not system: macOS `say` is ~1064ms of FIXED per-call overhead plus
  # 0.4ms/char — a three-word opener costs as much as a paragraph, and time-to-first-
  # audio is dominated by it. Measured on the same machine, same sentences:
  #     macOS say   English 1065ms   Hindi ~880ms   Telugu/Tamil skipped
  #     kokoro      English  385ms   Hindi  583ms   Telugu/Tamil declined -> fallback
  # Kokoro runs in-process, so it scales with the text instead of paying a subprocess
  # and a temp file every time. Set `provider: system` to go back.
  fallback: system           # who speaks the scripts kokoro can't (none = stay silent)
  cache: true                # LRU-cache audio (greetings/confirmations become instant)
  cache_size: 256
  rate: 175                  # words/min for pyttsx3
  voice: null                # optional OS voice id
  piper_model: en_US-amy-medium
  piper_model_path: null     # explicit path to a .onnx voice (scripts/download_piper_voice.sh)
  kokoro_voice: af_heart
  kokoro_lang: a             # a=en-US, h=hindi
  # --- indic_parler: AI4Bharat Indic-Parler-TTS — free, offline, ~21 Indian languages ---
  #   Set provider: indic_parler to SPEAK Hindi/Tamil/Telugu/Bengali/Marathi/etc.
  #   Language is auto-detected from the text; voice/style is set by the description below.
  #   First run downloads ~2GB from Hugging Face. Needs: pip install -r requirements-voice.txt
  device: null               # null = cuda→cpu auto. Set "mps" to try Apple GPU (may be flaky).
  # ---- brand voice: say the fixed lines once, in the owner's voice -----------------
  # Cloning is seconds per sentence on a CPU (XTTS says so in its own docstring; VoxCPM2
  # is a 2B model at RTF ~0.3 on a 4090), so it can never sit on a turn beside Kokoro's
  # measured 385ms. But it does not have to: 318 of the sentences this agent can say are
  # FIXED TEXT — the greeting, 60 slot questions, 108 safe lines across twelve languages,
  # and the knowledge answers the semantic fast path quotes verbatim. Rendered once when
  # the owner records their voice and PINNED in the cache, they cost nothing per call.
  # Runs in the background after /voice/clone; a line not ready yet simply misses and is
  # spoken by the live synthesiser, exactly as before.
  prerender_clone: true
  prerender_budget_s: 900    # stop after this and keep whatever is done — a partial
                             #   render is a partial improvement, not a broken state
  indic_description: "A female speaker with a clear, warm, natural voice speaks at a moderate pace with expressive intonation. The recording is very high quality with no background noise."

# Grounding guard — checks the model instead of trusting it (see zensuvidha/guard.py).
# A small model asked for a service you don't offer WILL invent a price, and it drifts
# worst in Hindi/Telugu/Tamil. Nothing is spoken until it has passed these checks.
guard:
  enabled: true
  check_numbers: true        # every ₹ fee / phone / timing in a reply must appear in the
                             #   pack's facts or in something the caller said. This is the
                             #   one that stops "neurologist ka fee ₹1,000 hai".
  check_repetition: true     # catch a reply that collapsed into repeating one clause —
                             #   how a small model fails in Telugu/Tamil when it runs dry
  check_script: true         # the reply must be in the language the caller is speaking —
                             #   catches a Telugu call answered in English or half-Hindi.
  min_script_share: 0.25     # target-script letters needed to count as "in that language".
                             #   Low on purpose: Latin proper nouns (Dr Rao, UPI, HDFC)
                             #   inside a native-script sentence are normal.
  trim_truncated: true       # cut a reply that ran out of tokens back to its last whole
                             #   sentence instead of speaking a fragment
  log_only: false            # true = log what WOULD be blocked but still speak it (tuning)

server:
  host: 127.0.0.1
  port: 8000
  streaming: true            # stream LLM → speak sentence-by-sentence (low latency)
  log_timings: true          # log STT/LLM/TTS timing per turn
  # ---- logging ----
  log_level: INFO            # DEBUG | INFO | WARNING | ERROR
  log_file: null             # e.g. logs/zensuvidha.log → rotating file (5MB × 5). null = console only
  log_json: false            # true = structured JSON logs (Loki/Datadog/CloudWatch)
  # admin_token: null       # required for /transcripts and /bookings from OFF-loopback
                             #   clients. Those return caller names, phone numbers and full
                             #   call text. Localhost is always allowed; remote without a
                             #   token is refused.
  log_transcripts: true      # persist each turn (caller text, reply, language, latency) to SQLite
                             #   → GET /transcripts?call_id=… (contains caller PII; disable if not needed)
  synth_workers: 3           # max sentences synthesised in parallel per turn (sent in order)
  pcm_streaming: true        # ship TTS audio frame-by-frame for providers that can render
                             #   progressively (kokoro). SELF-GATING: a provider without
                             #   .synth_stream (macOS `say`, piper, xtts) keeps the
                             #   whole-clip path, so this can never make them slower.
  stream_queue: 24           # frames buffered per sentence before the renderer waits on
                             #   the socket (backpressure — bounds memory on a slow link)
  speculative_stt: true      # transcribe an utterance at ~450ms of silence WHILE the
                             #   caller may still be pausing, and hold the result. If they
                             #   resume, it's discarded; if they were done, the turn starts
                             #   with zero STT on the clock. Partials NEVER reach the LLM —
                             #   the guard must ground numbers against complete words.
  filler: null               # optional phrase spoken instantly after STT to mask LLM think
                             #   time, e.g. "One moment.". null = off (best for multilingual).
  # A caller who goes quiet. A real receptionist asks once and then lets the line go;
  # without this the call sits open forever holding a session slot and the caller gets
  # no cue that anyone is still there. 0 disables either step.
  idle_prompt_seconds: 30    # ...ask "are you still there?" (only counts silence AFTER
                             #   the agent has finished — a turn in flight is not idle)
  idle_hangup_seconds: 75    # ...then say goodbye and close the call. Generous on
                             #   purpose: a caller looking up a phone number or talking
                             #   to somebody beside them must not be cut off.
  slow_filler_seconds: 2.0   # if a reply takes longer than this, speak a language-matched
                             #   "let me check…" filler so the caller never hears dead air. 0=off.
  max_sessions: 6            # MEASURED on this CPU (M1 Pro, qwen3:4b via Ollama/Metal):

  # --- naturalness & telephony (all measured; see docs/EXPLAINED.md) ----------
  turn_eagerness: normal     # eager | normal | patient — how long to wait before
                             #   deciding the caller has finished. It SCALES the ladder
                             #   in zensuvidha/turn.py rather than replacing it, so every
                             #   measured rule still holds; only the patience changes.
                             #     eager   0.70x window — a restaurant taking table
                             #             numbers, callers who answer in one word
                             #     normal  1.00x        — the tuned default
                             #     patient 1.45x        — elderly or unwell callers,
                             #             a noisy shop, anyone who thinks mid-sentence
                             #   `settled` is NOT scaled: "the words are finished and
                             #   nothing can follow" is a fact about the transcript, not
                             #   a preference, and making a completed phone number wait
                             #   longer is just a slower call.
                             #   The policy is SENT to the browser on connect, so the
                             #   browser, the phone endpointer and the server all size a
                             #   turn identically — they used to have three copies.
  prosody: true              # read the caller's PITCH to tell "finished" from "paused
                             #   mid-thought". The third turn-taking signal, behind
                             #   silence and behind the words, and the only one that
                             #   listens to the voice rather than counting or reading.
                             #   MEASURED: pitch slope alone cannot do it — the same
                             #   sentence finished and cut after three words gave -6.6
                             #   and -6.7 semitones/sec. Combined with energy decay it
                             #   separates, but only by 8.1 vs 7.0, so there is a DEAD
                             #   BAND: it answers "unsure" (which changes nothing)
                             #   unless it is well clear. On the 9-clip calibration set
                             #   it acted on 4 and was wrong on 0. ~1.6ms per turn.
                             #   Advisory: it scales the endpoint window by 0.80/1.25
                             #   and never decides a turn. `looks_incomplete` always
                             #   wins — "my mobile number is" said with a perfect
                             #   falling contour has still not given us the number.
  backchannel: true          # a quiet "mm-hm" at a pause on a long turn, so the agent
                             #   is not silent and then abruptly speaking. Once per
                             #   turn, ducked, never over a word.
  speculative_reply: auto    # auto | true | false. AUTO probes this machine at
                             #   startup: one short generation, then two together.
                             #   If the pair takes under 1.5x the single they truly
                             #   overlap and it switches ON; if they serialise it
                             #   stays off and says so in the log.
                             # MEASURED OFF on one local Ollama: the real turn goes
                             #   2339ms -> 6044ms, because requests are serialised per
                             #   model and the real generation queues BEHIND the guess.
                             #   Only enable where the server can truly run concurrent
                             #   requests (a GPU with spare capacity, OLLAMA_NUM_PARALLEL
                             #   >1 on hardware that can absorb it).
                             # answer the guess while the caller may still be pausing;
                             #   adopted ONLY if the committed transcript is identical.
                             #   Saves the gap between 450ms speculation and the 800-
                             #   1200ms endpoint. Read-only on the session.
                             #   concurrent   first audio   total turn
                             #        1           2.0s         4.3s
                             #        6           2.0s         9.6s
                             #   Streaming holds first-audio flat, but generation
                             #   serialises — at 24 a turn would take 30-40s. Raise this
                             #   to 24 with config.gpu.yaml, where the LLM is not the
                             #   bottleneck.

  # --- semantic knowledge search (zensuvidha/semantic.py) ---------------------
  semantic: true             # rank the per-turn facts by relevance, and answer the
                             #   questions people ask word-for-word STRAIGHT from the
                             #   pack — no model call, so it cannot invent and costs no
                             #   generation. Measured: 0.45ms vs 3219ms for the same
                             #   answer, and the pack already carries a_hi/a_te.
  semantic_device: null      # null = auto. "mps" is 40ms/query on an M1 against 150ms
                             #   on CPU — worth setting if you enable a neural model.
  semantic_model: null       # null = char n-grams, no download, works in every script.
                             #   Set a sentence-transformers name (e.g. a Qwen3-Embedding
                             #   model) to handle PARAPHRASE — measured, that is what
                             #   Indic queries need, and it is the only way the fast path
                             #   reaches the languages where latency hurts most.
                             #
                             # MEASURED with Qwen3-Embedding-0.6B on an M1 Pro:
                             #   cold load 243s · warm query 40ms (mps) / 150ms (cpu)
                             #   index 60 entries ~1.8s, once, cached with the pack
                             #   Indic 0.47-0.69 vs off-topic 0.25-0.40 → separable,
                             #   which char n-grams are NOT (0.21-0.49 vs 0.15-0.41).
                             #
                             # CONFLICT, and it matters: Qwen3 needs transformers>=4.51
                             # while parler-tts pins ==4.46.1 — and parler is the Indic
                             # TTS. In one environment you can have Indic RETRIEVAL or
                             # Indic SPEECH, not both. On the GPU preset, prefer speech.
  allow_clone: true          # enable /voice/clone (set false in public prod)
  max_upload_bytes: 6000000  # reject clone uploads larger than this (~6 MB)

default_pack: clinic
